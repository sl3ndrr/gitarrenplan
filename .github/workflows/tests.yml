name: Tests

on:
  push:
    branches:
      - main
      - feat/optimierung-und-pdf-layout
      - codex/gitarrenplan-ueberarbeitung
  pull_request:

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dev-Abhängigkeiten installieren
        run: npm install --ignore-scripts
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: PDF-Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: JavaScript linten
        run: npm run lint
      - name: Unit- und DOM-Tests ausführen
        if: success() || failure()
        run: npm run test:unit
      - name: Browser-Tests ausführen
        if: success() || failure()
        run: npm run test:browser
      - name: A4-PDFs erzeugen und prüfen
        if: success() || failure()
        run: npm run test:pdf
      - name: PDF-Prüfartefakte bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitarrenplan-pruefbelege
          path: |
            output/pdf
            output/evidence/*.png
            output/evidence/*.json
            output/evidence/*.pdf
            test-results
          if-no-files-found: warn
          retention-days: 14
